name: Build Android APK

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x PocketClaw/android/gradlew

      - name: Run Unit Tests
        working-directory: PocketClaw/android
        run: ./gradlew testDebugUnitTest --no-daemon --parallel --build-cache
        continue-on-error: true

      - name: Run Lint
        working-directory: PocketClaw/android
        run: ./gradlew lintDebug --no-daemon --parallel --build-cache
        continue-on-error: true

      - name: Build Debug APK
        working-directory: PocketClaw/android
        run: ./gradlew assembleDebug --no-daemon --parallel --build-cache

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: pocketclaw-debug-${{ github.sha }}
          path: PocketClaw/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
