name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x PocketClaw/android/gradlew

    - name: Build with Gradle
      run: cd PocketClaw/android && ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v5
      with:
        name: app-debug
        path: PocketClaw/android/app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        files: PocketClaw/android/app/build/outputs/apk/debug/app-debug.apk
        tag_name: build-${{ github.run_number }}
        body: |
          🦞 **PocketClaw Build #${{ github.run_number }}**
          
          APK: app-debug.apk
          
          **How to install:**
          1. Download app-debug.apk
          2. Transfer to your phone
          3. Enable "Unknown sources" in Settings
          4. Open APK and install
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
